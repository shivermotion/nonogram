<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram Puzzle Validator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn.success {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        .btn.danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .puzzle-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }
        
        .puzzle-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .puzzle-card.valid {
            border-color: #4CAF50;
            background: linear-gradient(135deg, #f8fff8, #e8f5e8);
        }
        
        .puzzle-card.ambiguous {
            border-color: #ff9800;
            background: linear-gradient(135deg, #fff8f0, #ffe8d1);
        }
        
        .puzzle-card.invalid {
            border-color: #f44336;
            background: linear-gradient(135deg, #fff5f5, #ffe8e8);
        }
        
        .puzzle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .puzzle-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-valid {
            background: #4CAF50;
            color: white;
        }
        
        .status-ambiguous {
            background: #ff9800;
            color: white;
        }
        
        .status-invalid {
            background: #f44336;
            color: white;
        }
        
        .grid-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .grid-section {
            flex: 1;
        }
        
        .grid-title {
            font-size: 0.9em;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
            text-align: center;
        }
        
        .grid {
            display: inline-grid;
            gap: 1px;
            background: #333;
            padding: 2px;
            border-radius: 4px;
        }
        
        .grid-5x5 {
            grid-template-columns: repeat(5, 20px);
            grid-template-rows: repeat(5, 20px);
        }
        
        .grid-10x10 {
            grid-template-columns: repeat(10, 15px);
            grid-template-rows: repeat(10, 15px);
        }
        
        .grid-15x15 {
            grid-template-columns: repeat(15, 12px);
            grid-template-rows: repeat(15, 12px);
        }
        
        .cell {
            background: white;
            border-radius: 2px;
        }
        
        .cell.filled {
            background: #333;
        }
        
        .cell.empty {
            background: white;
        }
        
        .puzzle-info {
            font-size: 0.85em;
            color: #666;
            line-height: 1.4;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f44336;
        }
        
        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧩 Nonogram Puzzle Validator</h1>
            <p>Verify that all puzzles are uniquely solvable using constraint propagation and backtracking</p>
        </div>
        
        <div class="content">
            <div class="controls">
                <button class="btn" id="loadPuzzlesBtn">📁 Load Puzzles</button>
                <button class="btn" id="validateBtn" disabled>🔍 Validate All</button>
                <button class="btn" id="exportBtn" disabled>📊 Export Report</button>
                <button class="btn danger" id="clearBtn">🗑️ Clear Results</button>
            </div>
            
            <div id="stats" class="stats" style="display: none;">
                <div class="stat-card">
                    <div class="stat-number" id="totalPuzzles">0</div>
                    <div class="stat-label">Total Puzzles</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="validPuzzles">0</div>
                    <div class="stat-label">Valid</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="ambiguousPuzzles">0</div>
                    <div class="stat-label">Ambiguous</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="invalidPuzzles">0</div>
                    <div class="stat-label">Invalid</div>
                </div>
            </div>
            
            <div id="results" class="results"></div>
            
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <div>Validating puzzles...</div>
            </div>
        </div>
    </div>

    <script>
        // Nonogram Solver Implementation
        class NonogramSolver {
            constructor() {
                this.EMPTY = 0;
                this.FILLED = 1;
                this.UNKNOWN = -1;
            }
            
            // Generate clues from a solution
            generateClues(line) {
                const clues = [];
                let currentGroup = 0;
                
                for (const cell of line) {
                    if (cell === true || cell === this.FILLED) {
                        currentGroup++;
                    } else if (currentGroup > 0) {
                        clues.push(currentGroup);
                        currentGroup = 0;
                    }
                }
                
                if (currentGroup > 0) {
                    clues.push(currentGroup);
                }
                
                return clues.length > 0 ? clues : [0];
            }
            
            generateAllClues(solution) {
                const height = solution.length;
                const width = solution[0]?.length || 0;
                
                const rowClues = [];
                const colClues = [];
                
                // Generate row clues
                for (let row = 0; row < height; row++) {
                    rowClues.push(this.generateClues(solution[row]));
                }
                
                // Generate column clues
                for (let col = 0; col < width; col++) {
                    const column = solution.map(row => row[col]);
                    colClues.push(this.generateClues(column));
                }
                
                return { rowClues, colClues };
            }
            
            // Solve a single line using constraint propagation
            solveLine(line, clues) {
                const length = line.length;
                const result = [...line];
                
                if (clues.length === 0 || (clues.length === 1 && clues[0] === 0)) {
                    // All empty
                    for (let i = 0; i < length; i++) {
                        if (result[i] === this.UNKNOWN) {
                            result[i] = this.EMPTY;
                        }
                    }
                    return result;
                }
                
                // Calculate minimum and maximum positions for each clue
                const minPositions = [];
                const maxPositions = [];
                let currentPos = 0;
                
                for (let i = 0; i < clues.length; i++) {
                    minPositions[i] = currentPos;
                    currentPos += clues[i] + (i < clues.length - 1 ? 1 : 0);
                }
                
                currentPos = length - 1;
                for (let i = clues.length - 1; i >= 0; i--) {
                    maxPositions[i] = currentPos - clues[i] + 1;
                    currentPos -= clues[i] + (i > 0 ? 1 : 0);
                }
                
                // Fill cells that must be filled
                for (let i = 0; i < clues.length; i++) {
                    const clue = clues[i];
                    const minPos = minPositions[i];
                    const maxPos = maxPositions[i];
                    
                    // Find overlap between min and max positions
                    const overlapStart = Math.max(minPos, maxPos);
                    const overlapEnd = Math.min(minPos + clue - 1, maxPos + clue - 1);
                    
                    for (let pos = overlapStart; pos <= overlapEnd; pos++) {
                        if (result[pos] === this.UNKNOWN) {
                            result[pos] = this.FILLED;
                        }
                    }
                }
                
                // Mark cells that must be empty
                for (let i = 0; i < clues.length; i++) {
                    const clue = clues[i];
                    const minPos = minPositions[i];
                    const maxPos = maxPositions[i];
                    
                    // Mark cells before the minimum position as empty
                    for (let pos = 0; pos < minPos; pos++) {
                        if (result[pos] === this.UNKNOWN) {
                            result[pos] = this.EMPTY;
                        }
                    }
                    
                    // Mark cells after the maximum position as empty
                    for (let pos = maxPos + clue; pos < length; pos++) {
                        if (result[pos] === this.UNKNOWN) {
                            result[pos] = this.EMPTY;
                        }
                    }
                }
                
                return result;
            }
            
            // Check if a line is valid according to clues
            isValidLine(line, clues) {
                const actualClues = this.generateClues(line);
                return JSON.stringify(actualClues) === JSON.stringify(clues);
            }
            
            // Check if grid is complete
            isComplete(grid) {
                for (let row = 0; row < grid.length; row++) {
                    for (let col = 0; col < grid[row].length; col++) {
                        if (grid[row][col] === this.UNKNOWN) {
                            return false;
                        }
                    }
                }
                return true;
            }
            
            // Check if grid has contradictions
            hasContradiction(grid, rowClues, colClues) {
                // Check rows
                for (let row = 0; row < grid.length; row++) {
                    const line = grid[row];
                    if (!this.isValidPartialLine(line, rowClues[row])) {
                        return true;
                    }
                }
                
                // Check columns
                for (let col = 0; col < grid[0].length; col++) {
                    const line = grid.map(row => row[col]);
                    if (!this.isValidPartialLine(line, colClues[col])) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // Check if a partial line could be valid
            isValidPartialLine(line, clues) {
                const groups = [];
                let currentGroup = 0;
                
                for (const cell of line) {
                    if (cell === this.FILLED) {
                        currentGroup++;
                    } else if (cell === this.EMPTY && currentGroup > 0) {
                        groups.push(currentGroup);
                        currentGroup = 0;
                    }
                }
                
                if (currentGroup > 0) {
                    groups.push(currentGroup);
                }
                
                // Check if current groups could lead to target clues
                if (groups.length > clues.length) {
                    return false;
                }
                
                for (let i = 0; i < groups.length; i++) {
                    if (groups[i] > clues[i]) {
                        return false;
                    }
                }
                
                return true;
            }
            
            // Find the best cell to guess
            findBestGuess(grid) {
                for (let row = 0; row < grid.length; row++) {
                    for (let col = 0; col < grid[row].length; col++) {
                        if (grid[row][col] === this.UNKNOWN) {
                            return { row, col };
                        }
                    }
                }
                return null;
            }
            
            // Copy grid
            copyGrid(grid) {
                return grid.map(row => [...row]);
            }
            
            // Solve puzzle using constraint propagation + backtracking
            solvePuzzle(rowClues, colClues, maxSolutions = 2) {
                const height = rowClues.length;
                const width = colClues.length;
                
                // Initialize grid with unknowns
                let grid = Array(height).fill().map(() => Array(width).fill(this.UNKNOWN));
                
                const solutions = [];
                
                const solve = (currentGrid) => {
                    // Apply constraint propagation
                    let changed = true;
                    while (changed) {
                        changed = false;
                        
                        // Solve rows
                        for (let row = 0; row < height; row++) {
                            const newRow = this.solveLine(currentGrid[row], rowClues[row]);
                            if (JSON.stringify(newRow) !== JSON.stringify(currentGrid[row])) {
                                currentGrid[row] = newRow;
                                changed = true;
                            }
                        }
                        
                        // Solve columns
                        for (let col = 0; col < width; col++) {
                            const column = currentGrid.map(row => row[col]);
                            const newColumn = this.solveLine(column, colClues[col]);
                            if (JSON.stringify(newColumn) !== JSON.stringify(column)) {
                                for (let row = 0; row < height; row++) {
                                    currentGrid[row][col] = newColumn[row];
                                }
                                changed = true;
                            }
                        }
                        
                        // Check for contradictions
                        if (this.hasContradiction(currentGrid, rowClues, colClues)) {
                            return;
                        }
                    }
                    
                    // Check if complete
                    if (this.isComplete(currentGrid)) {
                        solutions.push(this.copyGrid(currentGrid));
                        return;
                    }
                    
                    // If we already have enough solutions, stop
                    if (solutions.length >= maxSolutions) {
                        return;
                    }
                    
                    // Find best cell to guess
                    const guess = this.findBestGuess(currentGrid);
                    if (!guess) {
                        return;
                    }
                    
                    // Try filling the cell
                    const gridFilled = this.copyGrid(currentGrid);
                    gridFilled[guess.row][guess.col] = this.FILLED;
                    solve(gridFilled);
                    
                    // If we still need more solutions, try empty
                    if (solutions.length < maxSolutions) {
                        const gridEmpty = this.copyGrid(currentGrid);
                        gridEmpty[guess.row][guess.col] = this.EMPTY;
                        solve(gridEmpty);
                    }
                };
                
                solve(grid);
                return solutions;
            }
            
            // Validate a puzzle
            validatePuzzle(solution) {
                const { rowClues, colClues } = this.generateAllClues(solution);
                const solutions = this.solvePuzzle(rowClues, colClues, 2);
                
                if (solutions.length === 0) {
                    return { status: 'UNSOLVABLE', solutions: [] };
                } else if (solutions.length > 1) {
                    return { status: 'AMBIGUOUS', solutions };
                } else {
                    const foundSolution = solutions[0];
                    const matches = this.solutionsMatch(foundSolution, solution);
                    return { 
                        status: matches ? 'VALID' : 'MISMATCH', 
                        solutions: [foundSolution] 
                    };
                }
            }
            
            // Check if two solutions match
            solutionsMatch(solution1, solution2) {
                if (solution1.length !== solution2.length) return false;
                if (solution1[0].length !== solution2[0].length) return false;
                
                for (let row = 0; row < solution1.length; row++) {
                    for (let col = 0; col < solution1[row].length; col++) {
                        // Convert both to boolean for comparison
                        const val1 = solution1[row][col] === this.FILLED || solution1[row][col] === true;
                        const val2 = solution2[row][col] === this.FILLED || solution2[row][col] === true;
                        if (val1 !== val2) {
                            return false;
                        }
                    }
                }
                return true;
            }
        }

        // Puzzle Data (will be loaded from puzzles.ts)
        let puzzleData = [];
        let validationResults = [];
        
        const solver = new NonogramSolver();
        
        // UI Elements
        const loadPuzzlesBtn = document.getElementById('loadPuzzlesBtn');
        const validateBtn = document.getElementById('validateBtn');
        const exportBtn = document.getElementById('exportBtn');
        const clearBtn = document.getElementById('clearBtn');
        const stats = document.getElementById('stats');
        const results = document.getElementById('results');
        const loading = document.getElementById('loading');
        
        // Load puzzle data
        loadPuzzlesBtn.addEventListener('click', () => {
            loadPuzzleData();
        });
        
        // Validate all puzzles
        validateBtn.addEventListener('click', () => {
            validateAllPuzzles();
        });
        
        // Export results
        exportBtn.addEventListener('click', () => {
            exportResults();
        });
        
        // Clear results
        clearBtn.addEventListener('click', () => {
            clearResults();
        });
        
        function loadPuzzleData() {
            // Load the actual puzzle data
            fetch('./puzzle-data.js')
                .then(response => response.text())
                .then(data => {
                    // Execute the JavaScript to get PUZZLE_DATA
                    eval(data);
                    puzzleData = window.PUZZLE_DATA || PUZZLE_DATA;
                    
                    validateBtn.disabled = false;
                    showMessage(`Loaded ${puzzleData.length} puzzles successfully!`, 'success');
                })
                .catch(error => {
                    console.error('Error loading puzzle data:', error);
                    showMessage('Error loading puzzle data. Please ensure puzzle-data.js exists.', 'error');
                });
        }
        
        function validateAllPuzzles() {
            loading.style.display = 'block';
            results.innerHTML = '';
            stats.style.display = 'none';
            
            validationResults = [];
            
            setTimeout(() => {
                puzzleData.forEach((puzzle, index) => {
                    const result = solver.validatePuzzle(puzzle.solution);
                    validationResults.push({
                        ...puzzle,
                        validation: result
                    });
                });
                
                displayResults();
                loading.style.display = 'none';
                exportBtn.disabled = false;
            }, 100);
        }
        
        function displayResults() {
            const validCount = validationResults.filter(r => r.validation.status === 'VALID').length;
            const ambiguousCount = validationResults.filter(r => r.validation.status === 'AMBIGUOUS').length;
            const invalidCount = validationResults.filter(r => r.validation.status === 'UNSOLVABLE' || r.validation.status === 'MISMATCH').length;
            
            // Update stats
            document.getElementById('totalPuzzles').textContent = validationResults.length;
            document.getElementById('validPuzzles').textContent = validCount;
            document.getElementById('ambiguousPuzzles').textContent = ambiguousCount;
            document.getElementById('invalidPuzzles').textContent = invalidCount;
            
            stats.style.display = 'grid';
            
            // Display results
            results.innerHTML = validationResults.map(puzzle => {
                const status = puzzle.validation.status;
                const statusClass = status === 'VALID' ? 'valid' : 
                                  status === 'AMBIGUABLE' ? 'ambiguous' : 'invalid';
                
                return `
                    <div class="puzzle-card ${statusClass}">
                        <div class="puzzle-header">
                            <div class="puzzle-title">${puzzle.name}</div>
                            <div class="status-badge status-${status.toLowerCase()}">${status}</div>
                        </div>
                        
                        <div class="grid-container">
                            <div class="grid-section">
                                <div class="grid-title">Intended Solution</div>
                                <div class="grid ${getGridClass(puzzle.solution)}">
                                    ${renderGrid(puzzle.solution)}
                                </div>
                            </div>
                            
                            <div class="grid-section">
                                <div class="grid-title">Solver Result</div>
                                <div class="grid ${getGridClass(puzzle.solution)}">
                                    ${puzzle.validation.solutions.length > 0 ? 
                                        renderGrid(puzzle.validation.solutions[0]) : 
                                        '<div style="grid-column: 1/-1; text-align: center; color: #999;">No Solution</div>'
                                    }
                                </div>
                            </div>
                        </div>
                        
                        <div class="puzzle-info">
                            <strong>ID:</strong> ${puzzle.id}<br>
                            <strong>Category:</strong> ${puzzle.category}<br>
                            <strong>Difficulty:</strong> ${puzzle.difficulty}<br>
                            <strong>Description:</strong> ${puzzle.description}
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function getGridClass(solution) {
            const size = solution.length;
            if (size === 5) return 'grid-5x5';
            if (size === 10) return 'grid-10x10';
            if (size === 15) return 'grid-15x15';
            return 'grid-5x5';
        }
        
        function renderGrid(solution) {
            return solution.map(row => 
                row.map(cell => 
                    `<div class="cell ${cell ? 'filled' : 'empty'}"></div>`
                ).join('')
            ).join('');
        }
        
        function exportResults() {
            const report = {
                timestamp: new Date().toISOString(),
                totalPuzzles: validationResults.length,
                validPuzzles: validationResults.filter(r => r.validation.status === 'VALID').length,
                ambiguousPuzzles: validationResults.filter(r => r.validation.status === 'AMBIGUOUS').length,
                invalidPuzzles: validationResults.filter(r => r.validation.status === 'UNSOLVABLE' || r.validation.status === 'MISMATCH').length,
                results: validationResults.map(r => ({
                    id: r.id,
                    name: r.name,
                    status: r.validation.status,
                    category: r.category,
                    difficulty: r.difficulty
                }))
            };
            
            const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `puzzle-validation-report-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        function clearResults() {
            validationResults = [];
            results.innerHTML = '';
            stats.style.display = 'none';
            exportBtn.disabled = true;
            validateBtn.disabled = true;
        }
        
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = type === 'success' ? 'success-message' : 'error';
            messageDiv.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(messageDiv, content.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 3000);
        }
        
        // Initialize
        showMessage('Click "Load Puzzles" to begin validation', 'success');
    </script>
</body>
</html>
